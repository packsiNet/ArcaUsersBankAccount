server {
    listen 80;
    server_name account.zanatech.online;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name account.zanatech.online;
    ssl_certificate /etc/letsencrypt/live/account.zanatech.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/account.zanatech.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 32k;
    # Do not log query strings, request bodies, names, bank values or cookies.
    access_log off;
    gzip on;
    gzip_types text/css application/javascript;
    gzip_vary on;
    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append user-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_cache off;
    }
}
